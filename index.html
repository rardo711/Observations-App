<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the home indicator;
         the CSS below pads it back out with the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Coaching Observations</title>
    <meta name="description" content="Track floor observations, recurring gaps, and the commitments that follow." />

    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Matches the header, which is what sits behind the status bar. -->
    <meta name="theme-color" content="#FFFFFF" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The name that ends up under the icon on an iPhone home screen. -->
    <meta name="apple-mobile-web-app-title" content="Observations" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E20074'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Inline on purpose: if the bundle itself fails to load, nothing from the
      bundle can report it. Without this a failed boot is an unexplained white
      screen with no way out, which is exactly what a stale cached index.html
      pointing at deleted assets produces.
    -->
    <script>
      (function () {
        var broken = [];
        addEventListener(
          'error',
          function (e) {
            var el = e.target;
            if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
              broken.push((el.src || el.href || '').split('/').pop());
            }
          },
          true
        );

        function recover() {
          var done = function () {
            // A plain reload can be answered from the same stale HTTP cache
            // that caused this, so bust it with a one-off query string.
            location.replace(location.pathname + '?reset=' + Date.now());
          };
          var jobs = [];
          if (navigator.serviceWorker) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              })
            );
          }
          if (window.caches) {
            jobs.push(
              caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              })
            );
          }
          Promise.all(jobs).then(done, done);
        }

        function check() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="font:16px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;color:#16181D;padding:24px;max-width:32rem;margin:0 auto">' +
            '<h1 style="font-size:20px;margin:0 0 8px">This didn\'t load</h1>' +
            '<p style="color:#6B7076;margin:0 0 16px">The app files didn\'t arrive. This is almost always a stale cache — resetting it below will fix it. Your saved observations are stored separately and are not affected.</p>' +
            (broken.length
              ? '<p style="color:#6B7076;font-size:13px;margin:0 0 16px">Failed to load: ' +
                broken.join(', ') +
                '</p>'
              : '') +
            '<button id="obs-reset" style="appearance:none;border:0;background:#E20074;color:#fff;font:600 16px/1 inherit;padding:14px 20px;border-radius:12px;width:100%">Reset and reload</button>' +
            '</div>';
          document.getElementById('obs-reset').addEventListener('click', recover);
        }

        // Module scripts run before load; 4s is well past a normal mount and
        // short enough that nobody sits looking at nothing.
        addEventListener('load', function () { setTimeout(check, 4000); });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
